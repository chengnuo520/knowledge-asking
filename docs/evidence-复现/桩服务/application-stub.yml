# 桩模式配置：把 remote-deepseek 指到本地假服务（http://localhost:9099）
# 启动方式见文档「零代码换上游」一节：
#   mvn spring-boot:run -Dspring-boot.run.arguments="--spring.config.additional-location=file:docs/evidence-复现/桩服务/application-stub.yml --spring.sql.init.mode=never"
# 说明：chat.models 是列表，外部配置会整表覆盖 application.yml 中的同名列表，
#       因此这里必须把 3 个模型都写全（少写一个，下拉框里就少一个）。
chat:
  models:
    - id: remote-deepseek
      name: "Stub 假模型 (本地 9099)"
      base-url: http://localhost:9099
      api-key: stub-key
      model-name: deepseek-flash
      temperature: 0.7

    - id: ollama-deepseek-r1
      name: "DeepSeek R1 (本地/Ollama)"
      base-url: http://localhost:9099
      api-key: stub-key
      model-name: deepseek-r1:latest
      temperature: 0.7

    - id: ollama-qwen3-vl
      name: "Qwen3-VL-4B (本地/Ollama)"
      base-url: http://localhost:9099
      api-key: stub-key
      model-name: "modelscope.cn/Qwen/Qwen3-VL-4B-Instruct-GGUF:latest"
      temperature: 0.7
