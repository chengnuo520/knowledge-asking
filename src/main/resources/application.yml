server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agentscope-chat
  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${RAG_DB_USERNAME:postgres}
    password: ${RAG_DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 5000
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

rag:
  max-file-size-mb: 20
  chunk:
    max-chars: 1024
    overlap-chars: 128
    rows-per-chunk: 50
    tolerance-factor: 3

# 接口限流（RateLimitFilter）：固定窗口，按客户端 IP 计数
# 演示时可临时调小：--rate-limit.limit=2 --rate-limit.window-seconds=60
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  limit: ${RATE_LIMIT_LIMIT:60}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  max-clients: 10000

chat:
  models:
    - id: remote-deepseek
      name: "DeepSeek Chat (远程)"
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash
      temperature: 0.7

    - id: ollama-deepseek-r1
      name: "DeepSeek R1 (本地/Ollama)"
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: deepseek-r1:latest
      temperature: 0.7

    - id: ollama-qwen3-vl
      name: "Qwen3-VL-4B (本地/Ollama)"
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: "modelscope.cn/Qwen/Qwen3-VL-4B-Instruct-GGUF:latest"
      temperature: 0.7
