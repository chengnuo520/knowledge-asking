server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agentscope-chat

chat:
  models:
    - id: remote-deepseek
      name: "DeepSeek Chat (远程)"
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash
      temperature: 0.7

    - id: ollama-deepseek-r1
      name: "DeepSeek R1 (本地/Ollama)"
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: deepseek-r1:latest
      temperature: 0.7

    - id: ollama-qwen3-vl
      name: "Qwen3-VL-4B (本地/Ollama)"
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: "modelscope.cn/Qwen/Qwen3-VL-4B-Instruct-GGUF:latest"
      temperature: 0.7
